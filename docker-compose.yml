services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buteco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buteco_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-buteco_agents}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - buteco-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buteco} -d ${POSTGRES_DB:-buteco_agents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-buteco}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-buteco_dev_password}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - buteco-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buteco-postgres-data:
  buteco-rabbitmq-data:
