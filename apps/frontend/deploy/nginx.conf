# nginx do stack de servidor (docker-compose.prod.yml) — serve o build
# estático do SPA e roteia por prefixo de path para apps/api/apps/inbox/
# apps/connectors via nome de serviço na rede do compose. Não termina TLS: escuta só numa
# porta interna do host, atrás de um nginx/Cloudflare já existentes, fora
# deste stack (openspec/changes/containerizacao-stack-servidor/design.md, D2).
#
# Regex com (/|$) no fim de cada prefixo: uma location prefix simples
# (`location /agents`) também casaria com `/agentsxyz`, que não deveria
# ir pra apps/api.
#
# A lista de prefixos de cada bloco cobre TODOS os prefixos de rota que
# apps/api, apps/inbox e apps/connectors servem, e se deriva deles — não se mantém de
# memória. Prefixo servido e ausente daqui não dá 404: cai no fallback de
# SPA abaixo e devolve 200 com HTML, que é a resposta errada com o status
# certo. Para reconferir:
#   grep -rhoE '"/[a-z0-9-]+' --include="*.cs" apps/api/src/Buteco.Api/ | sort -u
#   grep -rhoE '"/[a-z0-9-]+' --include="*.cs" apps/inbox/src/Buteco.Inbox/ | sort -u
#   grep -rhoE '"/[a-z0-9-]+' --include="*.cs" apps/connectors/src/Buteco.Connectors/ | sort -u
# /health é a exceção deliberada: os healthchecks rodam dentro de cada
# contêiner contra o próprio processo e não atravessam este nginx.
# Ruído conhecido dos greps, que NÃO é prefixo servido: /test e
# /indexing-summary (apps/api) são sub-rotas de grupo (/mcp-servers/test,
# /knowledge-bases/indexing-summary); /api (apps/inbox) é chamada de SAÍDA
# para o WAHA; /agents no apps/inbox é chamada de SAÍDA para o apps/api
# (validação de referência de agente); /sync no apps/connectors é chamada de
# SAÍDA para o apps/api (ciclo de sincronização) e /providers no apps/connectors
# é sub-rota do grupo /connectors. Ruído novo: conferir o MapGet/MapPost
# ou MapGroup do literal antes de descartar.
#
# Achado empírico (via smoke-test real, não assumido): /agents, /channels,
# /mcp-servers e /knowledge-bases são ao mesmo tempo rota de página do
# react-router (apps/frontend/src/app/routes.tsx) E prefixo de API — o
# mesmo path serve os dois propósitos. Sem tratamento, um refresh/link direto em
# `/agents/{id}` batia no proxy pra apps/api (502 sem api no ar; JSON
# em vez do SPA com api no ar), nunca no fallback de SPA. Resolvido com
# o header `Sec-Fetch-Mode` — enviado automaticamente por browsers
# modernos (não pela app), `navigate` só em navegação real de
# documento, nunca em fetch()/XHR disparado por JS já carregado.
# Requisição de navegação sempre cai no shell do SPA, mesmo em paths que
# também são prefixo de API; fetch()/XHR da própria SPA (sem esse header
# como `navigate`) segue pro backend normalmente. Limitação aceita:
# clientes que não enviam esse header (raros, pre-2020) não teriam o
# fallback de SPA nesses três prefixos especificamente.
#
# Achado empírico: `proxy_pass http://api:8080` com hostname literal
# resolve o nome no CARREGAMENTO da config, não por requisição — se
# api/inbox ainda não estiverem no ar quando o nginx sobe, o processo
# nem inicia ("host not found in upstream"). Usar variável +
# `resolver` (DNS embutido do Docker/Compose, 127.0.0.11) adia a
# resolução pra cada requisição: se api/inbox não estiverem prontos
# ainda, a requisição individual falha (502), mas o nginx sobe normalmente
# e se recupera sozinho assim que o serviço ficar disponível.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(agents|providers|mcp-servers|knowledge-bases|knowledge-index|insights|auth)(/|$) {
        if ($http_sec_fetch_mode = navigate) {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Emissor OIDC do apps/api (#179, change emissor-oidc-api, D10). Os três
    # endpoints são do OpenIddict, não passam pelo roteamento e por isso NÃO
    # aparecem nos greps de prefixo acima; a lista deles é a
    # IdentityIssuerEndpoints.Expected do apps/api.
    #
    # `/.well-known/` é prefixo de uso geral na web (ACME, security.txt), então
    # só as duas URIs do emissor vão para o apps/api, em blocos exatos. Sem o
    # desvio de navegação: abrir o discovery ou o JWKS no browser deve mostrar
    # o JSON, e nenhuma página do SPA tem esses caminhos.
    location = /.well-known/openid-configuration {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/jwks {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Authorize e encerramento de sessão do emissor (#180, change
    # usuarios-locais-login-emissor, D3.5): navegações de browser por definição, então
    # SEM o desvio de navegação. Em blocos exatos, como o /.well-known acima: o
    # `location =` vence a regex de /connect abaixo, e um endpoint novo do OpenIddict sob
    # /connect não ganha navegação direta por acidente.
    location = /connect/authorize {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /connect/logout {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # O resto de /connect, hoje só /connect/token: POST de máquina, e por isso segue o
    # desvio de navegação de todo bloco de API.
    location ~ ^/(connect)(/|$) {
        if ($http_sec_fetch_mode = navigate) {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(channels|contacts|sessions|messages|webhooks|internal)(/|$) {
        if ($http_sec_fetch_mode = navigate) {
            rewrite ^ /index.html last;
        }
        set $inbox_upstream inbox:8080;
        proxy_pass http://$inbox_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # apps/connectors (#119). `connectors` não é rota de página hoje, mas o
    # desvio de navegação entra igual aos outros blocos, para que uma página
    # futura com esse nome não quebre no refresh. O upstream em variável é o que
    # deixa o nginx subir com o apps/connectors fora do ar (chave do Google
    # inválida, por exemplo): só este prefixo responde 502.
    #
    # Sem proxy_read_timeout: vale o padrão de 60 s. O cadastro de base
    # sincronizada (bloco do apps/api) espera até 35 s pelo apps/connectors, e
    # essa conta foi feita contra os 60 s (D2 da criacao-base-sincronizada). A
    # exportação de Doc grande (até 120 s) roda no ciclo, por dentro da rede do
    # compose, e não passa por aqui.
    location ~ ^/(connectors)(/|$) {
        if ($http_sec_fetch_mode = navigate) {
            rewrite ^ /index.html last;
        }
        set $connectors_upstream connectors:8080;
        proxy_pass http://$connectors_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Shell do SPA com `Cache-Control: no-store`. Os blocos acima devolvem,
    # para a MESMA URL (ex. /agents), o shell numa navegação e JSON num
    # fetch(). Sem Cache-Control, o index.html (só com Last-Modified) é
    # cacheável por heurística: um refresh em /agents gravava o HTML sob essa
    # URL, e o fetch('/agents') seguinte da própria SPA saía do cache de
    # disco do browser com HTML, sem chegar a este nginx (change
    # nginx-shell-sem-cache-e-prefixo-messages, design.md).
    #
    # `location =` exata, e NÃO em `location /`: o rewrite de navegação e o
    # try_files abaixo reentram no roteamento com URI /index.html e caem aqui;
    # `location /` também serve /assets/*, cujos nomes com hash de conteúdo
    # devem continuar cacheáveis.
    #
    # Armadilha: add_header não é acumulativo entre níveis — o nível atual só
    # herda os add_header do nível de cima se não declarar nenhum. Um
    # add_header futuro no `server` (X-Content-Type-Options, CSP) passaria a
    # valer em tudo MENOS aqui, em silêncio, justamente no documento onde
    # header de segurança mais importa. Header global novo tem de ser repetido
    # neste bloco.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fallback de SPA: qualquer rota do react-router (ex. /agents-ui/123,
    # refresh numa rota profunda) que não bateu nos proxies acima cai
    # pro index.html, não 404.
    location / {
        try_files $uri /index.html;
    }
}
