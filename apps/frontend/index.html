<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Acento da marca (#2a6ecb, butecoBlue[6]). Pinta a barra do navegador
         em mobile e a moldura do app instalado. -->
    <meta name="theme-color" content="#2a6ecb" />
    <title>Buteco Agentes</title>
    <script data-mantine-script>
      try {
        var _colorScheme = window.localStorage.getItem('mantine-color-scheme-value');
        var colorScheme =
          _colorScheme === 'light' || _colorScheme === 'dark' || _colorScheme === 'auto'
            ? _colorScheme
            : 'auto';
        var computedColorScheme =
          colorScheme !== 'auto'
            ? colorScheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', computedColorScheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
