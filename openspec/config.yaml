schema: spec-driven

context: |
  Plataforma de gestão de agentes de IA.
  Monorepo com isolamento estrito entre QUATRO apps: apps/api, apps/workers,
  apps/inbox e apps/frontend nunca referenciam código interno umas das outras.
  Compartilhamento real só via libs/ explícita, pequena e versionada — nunca por
  padrão. Referência entre domínios de apps diferentes é sempre validada via HTTP
  autenticado, nunca por FK.
  Backend: .NET 10. apps/api = ASP.NET Core Minimal API (endpoints A2A via
  A2A/A2A.AspNetCore — o pacote de conveniência
  Microsoft.Agents.AI.Hosting.A2A.AspNetCore registra um único A2AServer por app
  via DI no startup, incompatível com agentes criados em runtime, então apps/api
  compõe A2AServer diretamente; ver
  openspec/changes/archive/2026-07-26-backend-agente-a2a-mvp/design.md).
  apps/workers = Worker Service (executa os agentes via Microsoft Agent Framework,
  chamando MCP e o LLM). apps/inbox = ASP.NET Core Minimal API, banco PRÓPRIO
  (buteco_inbox), isolado: catálogo de canais, CRM de Contact/Session, histórico
  de mensagens, orquestrador de debounce e adapters de canal. RabbitMQ é o broker
  entre api e workers. PostgreSQL com EF Core para o catálogo (agentes, servidores
  MCP, bindings, bases de conhecimento) e para o store durável de tasks/eventos do
  protocolo A2A (https://a2a-protocol.org/latest/) — nada de store em memória em
  produção.
  Frontend: apps/frontend = React + TypeScript + Vite + Mantine, seguindo o padrão
  visual e de composição de https://ui.mantine.dev.
  Adapters de canal implementados hoje: WAHA (WhatsApp HTTP API) e Telegram, sob
  o contrato de plugin de apps/inbox (três contratos obrigatórios por ChannelType
  mais um opcional de provisionamento de webhook), com mais canais a serem
  adicionados no futuro.
  Documentação: README.md e arquivos de vitrine/legal em inglês; docs/,
  CONTRIBUTING.md e CHANGELOG.md em pt-BR. Ver docs/conventions.md. Link para
  mudança arquivada usa sempre openspec/changes/archive/AAAA-MM-DD-<nome>/.
  Sempre utilize a ferramenta codegraph


rules:
  design:
    - Incluir a árvore de pastas completa proposta
    - Justificar qualquer conteúdo colocado em libs/
    - Antes de fixar qualquer versão de runtime, linguagem, framework ou
      biblioteca como decisão (ex. .NET, Node, Mantine, React), verificar a
      versão estável/LTS mais recente e ainda suportada na data atual — nunca
      assumir a partir de conhecimento de treinamento, que pode estar
      desatualizado. Buscar a informação (web/docs oficiais) antes de commitar
      a decisão.
    - Registrar no Open Questions apenas incertezas reais de negócio/produto —
      versões de dependências não são "pergunta aberta", são decisão a ser
      verificada antes de propor.
    - Sempre incluir testes unitários no frontend e backend (api e workers)
  proposal:
    - Mesma regra acima quando a proposta já envolver escolha de stack/versões.
    - Deixar explícito qual app (api, workers ou frontend) cada tarefa afeta
    - Nunca propor referência de projeto entre apps/api, apps/workers e apps/frontend
  tasks:
    - Cada tarefa deve indicar em qual app ela roda
    

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
