# Compose de SERVIDOR — roda o stack completo numa VM na cloud, atrás de
# um nginx/Cloudflare já existentes (fora deste stack, ver
# openspec/changes/archive/2026-08-26-containerizacao-stack-servidor/design.md,
# D2). Não confundir com docker-compose.yml (raiz), que continua sendo só
# a infra de desenvolvimento local — intocado por esta change (D3).
#
# Segredos vêm de .env.prod (copie de .env.prod.example), nunca
# versionado. Ver docs/deployment.md pra sequência de deploy e a tabela
# completa de variáveis por processo.
#
# Non-Goals explícitos (não sugerir nem alterar aqui): CI/CD, orquestrador
# além do compose, observabilidade/métricas, múltiplas réplicas de
# apps/workers/apps/inbox/apps/connectors — nunca usar `replicas > 1`/
# `deploy.replicas` nesses três serviços, cada um pelo próprio motivo:
# apps/connectors, o lock em memória do ciclo de sincronização (#105);
# apps/workers, decisão de disponibilidade em aberto na #48 (capacidade se
# conta em slots, réplicas × TaskConsumer__MaxConcurrentExecutions, e não é
# motivo); apps/inbox, decisão operacional, a rever na #165. Os locks dos dois
# últimos (pg_advisory_lock/xmin) vivem no Postgres e funcionam entre
# instâncias —, TLS (resolvido pelo nginx externo), WAHA (instância externa
# já existente, não sobe aqui).

services:
  postgres:
    # pgvector/pgvector:pg18, e não postgres:18: a tabela de fragmentos usa a
    # extensão `vector` (change knowledge-base-indexacao). ATENÇÃO à leitura
    # desta linha: há UM servidor Postgres aqui para DOIS bancos —
    # buteco_agents (apps/api + apps/workers) e buteco_inbox (apps/inbox) —,
    # então trocar a imagem troca também o servidor que hospeda o banco de
    # apps/inbox. É inócuo, porque a extensão é criada por banco e só
    # buteco_agents a tem, mas o compose NÃO isola os apps, e a frase existe
    # para não sugerir um isolamento que não há.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER — use --env-file .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD — use --env-file .env.prod}
      POSTGRES_DB: buteco_agents
    volumes:
      - buteco-postgres-data-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d buteco_agents"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta publicada no host — só acessível de dentro da rede do
    # compose (diferente do docker-compose.yml de dev).

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER — use --env-file .env.prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD — use --env-file .env.prod}
    volumes:
      - buteco-rabbitmq-data-prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta publicada no host — idem postgres.

  migrator:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    environment:
      API_DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=buteco_agents;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      INBOX_DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=buteco_inbox;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      API_BASE_URL: "http://api:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      # A MESMA variável entregue a workers, e é isso que faz os dois processos
      # concordarem sobre que dia é hoje. apps/api a lê como CONFIGURAÇÃO do
      # balde diário da agregação — nunca via TimeZoneInfo.Local — e confere no
      # boot: divergir reprova a subida. O :? garante o mesmo valor em toda
      # réplica, então o balde não depende de qual container respondeu.
      #
      # ANTES da change rotas-de-agregacao-sistema este serviço subia SEM TZ, e o
      # processo rodava em UTC enquanto o worker renderizava em America/Sao_Paulo.
      # É mudança que se nota: sem TZ definida, o api agora não sobe.
      TZ: ${TZ:?defina TZ com nome IANA canônico, sem prefixo ":" — use --env-file .env.prod}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=buteco_agents;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      # apps/api só checa PRESENÇA destas duas para listar o provedor em
      # GET /providers; quem as usa de verdade é apps/workers. Precisam
      # existir nos dois, senão a api anuncia e a task falha no worker.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Mcp__CredentialEncryptionKey: ${MCP_CREDENTIAL_ENCRYPTION_KEY:?defina MCP_CREDENTIAL_ENCRYPTION_KEY — use --env-file .env.prod}
      # Cifra em repouso das chaves de assinatura do emissor OIDC (#179). Só no
      # apps/api, e com valor distinto da MCP_CREDENTIAL_ENCRYPTION_KEY. Com
      # PUBLIC_DOMAIN definido o emissor está ligado, e sem esta chave o api não
      # sobe. Perdê-la torna as chaves gravadas ilegíveis (docs/deployment.md).
      Identity__SigningKeyEncryptionKey: ${IDENTITY_SIGNING_KEY_ENCRYPTION_KEY:?defina IDENTITY_SIGNING_KEY_ENCRYPTION_KEY — use --env-file .env.prod}
      PublicUrl__BaseUrl: ${PUBLIC_DOMAIN:?defina PUBLIC_DOMAIN — use --env-file .env.prod}
      Auth__TokenSigningKey: ${AUTH_TOKEN_SIGNING_KEY:?defina AUTH_TOKEN_SIGNING_KEY — use --env-file .env.prod}
      Auth__OperatorUsername: ${AUTH_OPERATOR_USERNAME:?defina AUTH_OPERATOR_USERNAME — use --env-file .env.prod}
      Auth__OperatorPasswordHash: ${AUTH_OPERATOR_PASSWORD_HASH:?defina AUTH_OPERATOR_PASSWORD_HASH — use --env-file .env.prod}
      # Endereço interno do apps/connectors, usado só na validação de pasta do
      # cadastro de base sincronizada (#104). Fixo, não é segredo; vazio faria o
      # cadastro Synced responder 503 connectors-not-configured.
      Connectors__BaseUrl: "http://connectors:8080"
    # Sem porta publicada — só o nginx do stack (serviço "frontend")
    # alcança apps/api, via nome de serviço na rede do compose.

  inbox:
    build:
      context: .
      dockerfile: apps/inbox/Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=buteco_inbox;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Inbox__CredentialEncryptionKey: ${INBOX_CREDENTIAL_ENCRYPTION_KEY:?defina INBOX_CREDENTIAL_ENCRYPTION_KEY — use --env-file .env.prod}
      Api__BaseUrl: "http://api:8080"
      # D8: mesmo domínio público de apps/api nesta change (trade-off
      # documentado — push notification interna sai e volta pela
      # internet pública; correção futura seria uma variável separada
      # só pra isso).
      PublicUrl__BaseUrl: ${PUBLIC_DOMAIN}
      Auth__TokenSigningKey: ${AUTH_TOKEN_SIGNING_KEY}
    # Sem porta publicada — idem apps/api.

  workers:
    # Sem HEALTHCHECK — apps/workers nunca serviu HTTP, sem /health pra
    # sondar (diferente de api/inbox/frontend, todos com HEALTHCHECK no
    # próprio Dockerfile). O `restart: unless-stopped` cobre o caso de o
    # processo cair — não há como verificar "está respondendo", só "está
    # rodando".
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${TZ:?defina TZ com nome IANA canônico, sem prefixo ":" — use --env-file .env.prod}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=buteco_agents;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Sem estas três o boot PASSA — a checagem de consistência do índice
      # não diverge de um índice vazio — e a PRIMEIRA indexação falha, com
      # modelo vazio e dimensão 0. appsettings.json (Production) não tem
      # default; só o appsettings.Development.json tem, e ele não é lido
      # dentro do contêiner.
      Embedding__Provider: ${EMBEDDING_PROVIDER:-openai}
      Embedding__Model: ${EMBEDDING_MODEL:?defina EMBEDDING_MODEL — sem default seguro, foi escolhido por medição}
      Embedding__Dimensions: ${EMBEDDING_DIMENSIONS:?defina EMBEDDING_DIMENSIONS — a coluna do índice é vector(4096), fixa na migration}
      # COM default, ao contrário das duas acima: 250 vale se ninguém definir,
      # e um valor <= 0 reprova o boot em vez de falhar por documento. Abaixe
      # este número se a indexação de documento grande falhar com 502 —
      # variá-lo é como o teto do gateway é descoberto, porque ele não foi
      # medido (só se sabe que 442 fragmentos falharam e 267 passaram).
      Embedding__BatchSize: ${EMBEDDING_BATCH_SIZE:-250}
      # Quantas tasks esta instância executa ao mesmo tempo (prefetch = concorrência
      # do canal de tasks). Default 4 NÃO MEDIDO (calibração na #48); fora de [1, 32]
      # reprova o boot. Rollback: 1, que é o comportamento anterior. Subir acima do N
      # verificado contra o max_connections do Postgres exige refazer a verificação
      # (docs/configuration.md).
      TaskConsumer__MaxConcurrentExecutions: ${TASK_CONSUMER_MAX_CONCURRENT_EXECUTIONS:-4}
      Mcp__CredentialEncryptionKey: ${MCP_CREDENTIAL_ENCRYPTION_KEY}
    # Sem porta — apps/workers nunca serviu HTTP.

  connectors:
    # UMA réplica só: o lock que impede dois ciclos de sincronização da mesma
    # base é em memória (#105, D10 da ciclo-de-sincronizacao). Sem banco, então
    # sem migrator; depende do apps/api saudável porque a primeira rodada do
    # ciclo roda logo depois do boot e chama o apps/api.
    build:
      context: .
      dockerfile: apps/connectors/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Mesma variável de api e inbox (fonte única). Terceiro processo com a
      # chave: risco aceito na #119, ver docs/deployment.md e a #117.
      Auth__TokenSigningKey: ${AUTH_TOKEN_SIGNING_KEY}
      # OPCIONAL: vazia, o provedor google-drive não existe e
      # GET /connectors/providers responde []. Presente e inválida, o processo
      # não sobe — e por isso o frontend NÃO depende deste serviço.
      GoogleDrive__ServiceAccountKeyBase64: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_BASE64:-}
      # Endereço interno do apps/api para o ciclo de sincronização (#105). Fixo;
      # vazio desligaria o ciclo.
      Api__BaseUrl: "http://api:8080"
    # Sem porta publicada — o nginx do stack alcança pelo nome de serviço.

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Caminho relativo (D2/D6 do design) — string vazia, não omitida
        # (achado da exploração: import.meta.env usa `??`, só cai no
        # default de dev em undefined, não em string vazia; o Dockerfile
        # falha o build se o ARG não for passado, ver
        # apps/frontend/Dockerfile).
        VITE_API_BASE_URL: ""
        VITE_INBOX_BASE_URL: ""
        # Opcional no Dockerfile (#106). Entra JUNTO com o bloco /connectors do
        # nginx.conf, nunca antes: com "" e sem o bloco, as chamadas caem no SPA.
        VITE_CONNECTORS_BASE_URL: ""
    restart: unless-stopped
    # Sem depends_on no connectors, de propósito: ele recusa subir com uma chave
    # do Google inválida, e isso não pode derrubar o painel. O nginx resolve o
    # upstream por requisição; com o connectors fora, só /connectors responde 502.
    depends_on:
      api:
        condition: service_healthy
      inbox:
        condition: service_healthy
    ports:
      # Só porta interna do host — nunca 80/443 diretamente. Quem recebe
      # tráfego público é o nginx/Cloudflare já existentes, fora deste
      # stack, fazendo proxy_pass pra essa porta.
      - "127.0.0.1:${STACK_HTTP_PORT:?defina STACK_HTTP_PORT — porta interna do host, nunca 80/443}:80"

volumes:
  buteco-postgres-data-prod:
  buteco-rabbitmq-data-prod:
